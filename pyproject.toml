[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlitefolio"
version = "0.1.0a1"
description = "Bounded, local review packets for trusted SQLite sample migrations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "SQLiteFolio contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3.12"]

[project.scripts]
sqlitefolio = "sqlitefolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
